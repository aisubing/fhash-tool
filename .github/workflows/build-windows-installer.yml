name: Build Windows installer

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Install Windows SDK 10.0.22621.0
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vsPath = & $vswhere -latest -products * -property installationPath | Select-Object -First 1
          $installer = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vs_installer.exe"
          & $installer modify --installPath $vsPath --add Microsoft.VisualStudio.Component.Windows11SDK.22621 --quiet --norestart --force
          if ($LASTEXITCODE -notin @(0, 3010)) {
            throw "Visual Studio installer failed with exit code $LASTEXITCODE"
          }

          $sdkPath = "${env:ProgramFiles(x86)}\Windows Kits\10\Include\10.0.22621.0"
          $deadline = (Get-Date).AddMinutes(10)
          while (-not (Test-Path $sdkPath) -and (Get-Date) -lt $deadline) {
            Start-Sleep -Seconds 10
          }
          if (-not (Test-Path $sdkPath)) {
            throw "Windows SDK 10.0.22621.0 was not installed"
          }

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build installer
        shell: pwsh
        run: |
          $version = ""
          if ($env:GITHUB_REF -like "refs/tags/*") {
            $version = $env:GITHUB_REF_NAME -replace "^v", ""
          }
          ./trunk/package_win_wui.ps1 -Version $version

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: fHash-windows-x64-setup
          path: trunk/out/fHash-*-x64-setup.exe
          if-no-files-found: error

      - name: Attach installer to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: trunk/out/fHash-*-x64-setup.exe
